<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link href="/Elementos/Styles/pregunta.css" rel="stylesheet">

</head>

<body>
<div class="contenedor">
  <div id="menu" th:with="preguntas=${session.get('pregunta')}" >
    <div th:each="i : ${#numbers.sequence(1,preguntas+1)}" th:text="${i}" class="hecho"></div>
    <div th:each="i : ${#numbers.sequence(preguntas+2,7)}" th:text="${i}"></div>

  </div>
  <div id="imagen" style="    background-image: url('/Elementos/Imagenes/superBalonDeOro.png');
    "></div>
  <div id="pregunta">
    <h2>Escribe todos los ganadores del balon de oro del 2004 al 2016 (No los pongas repetidos y en el siguiente formato:)</h2>
  </div>
  <div id="opciones">
    <form action="/Quiz/Jugar/pregunta4" id="respuesta" method="post">
<textarea name="seleccion" placeholder="jugador1, jugador2, jugador3..."></textarea>

      <button type="submit" class="enviar">Enviar</button>
    </form>
  </div>
</div>

</body>
</html>
