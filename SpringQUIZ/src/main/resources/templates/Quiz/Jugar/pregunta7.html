<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz</title>
    <link href="/Elementos/Styles/pregunta.css" rel="stylesheet">

</head>

<body>
<div class="contenedor">
    <div id="menu" th:with="preguntas=${session.get('pregunta')}" >
        <div th:each="i : ${#numbers.sequence(1,preguntas+1)}" th:text="${i}" class="hecho"></div>
        <div th:each="i : ${#numbers.sequence(preguntas+2,7)}" th:text="${i}"></div>

    </div>
    <div id="imagen" style="    background-image: url('/Elementos/Imagenes/botaDeOro.png');
    "></div>
    <div id="pregunta">
        <h2>Selecciona todos los jugadores que han ganado la Bota de Oro (máximo goleador de la temporada de ligas europeas) más de una vez:</h2>
    </div>
    <div id="opciones">
        <form action="/Quiz/Jugar/resultado" id="respuesta" method="post">

            <div class="checkboxes">
                <p>Luis Suárez</p>

                <input name="seleccion"
                       type="checkbox"
                       value="Luis"

                ></input>
            </div>
            <div class="checkboxes">
                <p>Zlatan Ibrahimović</p>
                <input name="seleccion" type="checkbox" value="Zlatan"></input>
            </div>
            <div class="checkboxes">
                <p>Harry Kane</p>
                <input name="seleccion" type="checkbox" value="Harry Kane"></input>
            </div>
            <div class="checkboxes">
                <p>Diego Forlán</p>
                <input name="seleccion" type="checkbox" value="Diego"></input>
            </div>
            <button type="submit" class="enviar">Enviar</button>
        </form>
    </div>
</div>

</body>
</html>
